[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suffice-routing"
version = "0.1.0"
description = "Query-only sufficiency-gated reasoning budget allocation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[project.optional-dependencies]
probe = ["torch>=2.4,<3"]
inference = ["torch>=2.4,<3", "transformers==4.46.3", "accelerate>=0.26", "safetensors>=0.4", "peft==0.13.2"]
analysis = ["scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8"]
data = ["pyarrow>=15,<22", "regex", "sympy>=1.12", "antlr4-python3-runtime==4.11.1"]

[project.scripts]
suffice-route = "suffice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
